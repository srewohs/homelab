# Install once per clone: pre-commit install
# Revs are pinned to commit SHAs; the version is in the trailing comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-private-strings
        name: check for private strings (denylist in the private repo)
        entry: scripts/check-private-strings.sh
        language: script
        types: [text]
        # Run even with no text files staged, for the identity check.
        always_run: true
