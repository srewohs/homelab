---
# Docker's key is published ASCII-armored, so like Jellyfin's it goes in as
# .asc with no dearmor step.
- name: Fetch Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Read the storage driver
  ansible.builtin.command: docker info --format '{{ "{{" }} .Driver {{ "}}" }}'
  register: docker_driver
  changed_when: false
  check_mode: false   # read-only; later tasks need its output in check mode too

- name: Fail if Docker fell back to an unsuitable storage driver
  ansible.builtin.assert:
    that: docker_driver.stdout in docker_allowed_storage_drivers
    fail_msg: >-
      Docker is using the '{{ docker_driver.stdout }}' storage driver. vfs
      copies every image layer in full and will fill the rootfs. Stop here and
      check that the container's rootfs supports overlayfs (ZFS 2.2+ does).
    success_msg: "Docker storage driver: {{ docker_driver.stdout }}"
