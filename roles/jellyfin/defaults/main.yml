---
# The render device passed in via `dev0` in the container's .conf.
jellyfin_render_device: /dev/dri/renderD128

# Diagnostic tooling. jellyfin-ffmpeg7 ships and uses its OWN bundled iHD
# driver (25.4.6 as tested against the A380), so these packages are NOT what
# makes transcoding work. They exist so `vainfo` and `intel_gpu_top` tell you
# the truth when something breaks.
jellyfin_install_gpu_tools: true
jellyfin_gpu_packages:
  - vainfo
  - intel-media-va-driver-non-free
  - intel-gpu-tools

# Adds contrib/non-free to apt. Required for intel-media-va-driver-non-free.
# This is the step that silently broke the first test container.
jellyfin_enable_nonfree: true

jellyfin_service_enabled: true

# Transcode scratch, ideally a separate dataset or mount. Jellyfin writes a marker
# file here before every HLS session, so if the mount is not owned by the
# jellyfin user, playback fails before ffmpeg is invoked.
jellyfin_transcode_path: /transcode
