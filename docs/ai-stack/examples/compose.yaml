# Lives at /opt/ai-stack/compose.yaml on the gateway CT. Secrets live in env/*.env, not here.
# Each service gets its own env file so no container holds another's keys.
name: ai-stack

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    restart: unless-stopped
    ports:
      - "3000:8080"
    env_file: env/open-webui.env
    volumes:
      - open-webui-data:/app/backend/data

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.1@sha256:501909ec6f504551f263f82fe8c53cfa34679d5753de507a2df69680a6021ad8
    restart: unless-stopped
    # On the LAN, not just localhost: the agent sandbox calls it directly.
    ports:
      - "4000:4000"
    env_file: env/litellm.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  litellm-db:
    image: postgres:16.15
    restart: unless-stopped
    env_file: env/litellm-db.env
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open-webui-data:
  litellm-db-data:
